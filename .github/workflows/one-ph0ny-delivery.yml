name: Complete ph0ny connector delivery
on:
  push:
    branches: [pro/use-ph0ny-sdk]
permissions:
  contents: write
concurrency:
  group: one-ph0ny-delivery
  cancel-in-progress: true
jobs:
  complete:
    if: github.repository == 'tangle-network/agent-integrations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bring in current main without changing main
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git merge --no-commit --no-ff origin/main
      - name: Complete the existing adapter
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('src/connectors/adapters/phony.ts'); s=p.read_text()
          if 'export function createPhonyConnector' not in s:
              match=re.search(r'async function ph0ny<T>\([\s\S]*?\n\}\n',s)
              assert match, 'ph0ny helper moved'
              helper=match.group(0)
              s=s[:match.start()]+s[match.end():]
              s=s.replace('/** One ph0ny API call through the SDK client; 401 surfaces as CredentialsExpired\n *  so the platform prompts a reconnect. */\n','')
              old='export const phonyConnector: ConnectorAdapter = {'
              assert old in s
              prefix='export interface PhonyConnectorOptions {\n  /** Operator-selected API, never taken from capability arguments. */\n  baseUrl?: string\n  fetchImpl?: typeof fetch\n}\n\n/** The production singleton and staging deployments share the same adapter. */\nexport function createPhonyConnector(options: PhonyConnectorOptions = {}): ConnectorAdapter {\n'
              helper=helper.replace('new VoiceClient({ apiKey: token })','new VoiceClient({ apiKey: token, baseUrl: options.baseUrl, fetchImpl: options.fetchImpl })')
              s=s.replace(old,prefix+'\n'.join('  '+line if line else '' for line in helper.splitlines())+'\n\n  return {')
              ending='\n}\n\nfunction bearerToken'
              assert ending in s
              s=s.replace(ending,'\n  }\n}\n\nexport const phonyConnector = createPhonyConnector()\n\nfunction bearerToken',1)
              s=s.replace('new VoiceClient({ apiKey: token })','new VoiceClient({ apiKey: token, baseUrl: options.baseUrl, fetchImpl: options.fetchImpl })')
              p.write_text(s)
          p=Path('src/connectors/adapters/index.ts'); s=p.read_text()
          assert "from './phony.js'" in s
          s=re.sub(r'export \{ phonyConnector \} from (\x27\./phony\.js\x27)',r'export { phonyConnector, createPhonyConnector, type PhonyConnectorOptions } from \1',s)
          assert 'createPhonyConnector' in s
          p.write_text(s)
          p=Path('package.json'); data=json.loads(p.read_text()); data['version']='0.56.0'; data['dependencies']['@ph0ny/sdk']='0.1.1'; p.write_text(json.dumps(data,indent=2)+'\n')
          p=Path('scripts/prove-one-ph0ny.mjs'); s=p.read_text()
          s=s.replace('const adapter = createPhonyConnector', "assert.equal(typeof client.fetchResponse, 'function', 'Install the SDK built from the owner PR');\nassert.equal(client.fetchImpl, tracedFetch, 'The SDK must preserve the real transport hook');\nconst adapter = createPhonyConnector")
          s=s.replace("  await save('result.json', { passed: true", "  assert.equal(writes, mode === '--dial' ? 1 : 0, 'Expected exactly one traced call, or no call in read-only mode');\n  await save('result.json', { passed: true")
          p.write_text(s)
          print('All connector routes now use the configured SDK instance; no provider request was made.')
          PY
          node --check scripts/prove-one-ph0ny.mjs
      - name: Commit the completed source to this PR only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,subprocess,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; parent=os.environ['GITHUB_SHA']; branch='pro/use-ph0ny-sdk'
          assert repo=='tangle-network/agent-integrations' and os.environ['GITHUB_REF_NAME']==branch
          def api(method,path,body=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,data=None if body is None else json.dumps(body).encode(),method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req) as r: return json.load(r)
          assert api('GET','git/ref/heads/'+branch)['object']['sha']==parent, 'Branch moved; refusing to overwrite'
          main=subprocess.check_output(['git','rev-parse','origin/main']).decode().strip()
          paths=subprocess.check_output(['git','diff','origin/main','--name-only']).decode().splitlines()
          entries=[]
          for p in paths:
              if Path(p).exists():
                  blob=api('POST','git/blobs',{'content':base64.b64encode(Path(p).read_bytes()).decode(),'encoding':'base64'})
                  entries.append({'path':p,'mode':'100644','type':'blob','sha':blob['sha']})
              else: entries.append({'path':p,'mode':'100644','type':'blob','sha':None})
          base=subprocess.check_output(['git','rev-parse','origin/main^{tree}']).decode().strip()
          tree=api('POST','git/trees',{'base_tree':base,'tree':entries})
          commit=api('POST','git/commits',{'message':'refactor(ph0ny): finish configurable SDK adapter and real-call proof','tree':tree['sha'],'parents':list(dict.fromkeys([parent,main]))})
          api('PATCH','git/refs/heads/'+branch,{'sha':commit['sha'],'force':False})
          print('SOURCE_COMMIT',commit['sha'])
          print('SOURCE_FILES',json.dumps(paths))
          PY
