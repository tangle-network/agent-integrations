name: Verify Router reader ownership
on:
  push:
    branches: [pro/tangle-agent-v1-router-reader]
    paths: [.github/workflows/tangle-reader-owner-check.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: pro/tangle-agent-v1-router-reader
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Keep the existing tcloud media owner
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/tangle-search/index.ts'); s=p.read_text()
          line="export { TangleMediaClient, type TangleMediaInput, type TangleMediaClientOptions } from './media.js'\n"
          assert s.count(line)==1
          p.write_text(s.replace(line,''))
          PY
          git add src/tangle-search/index.ts
          git rm src/tangle-search/media.ts .github/workflows/tangle-reader-owner-check.yml
          git -c user.name=tangletools -c user.email=hello@tangle.tools commit -m 'refactor: retain the existing tcloud media transport owner'
          git push origin HEAD:pro/tangle-agent-v1-router-reader
          mkdir -p /tmp/router-reader
          git rev-parse HEAD > /tmp/router-reader/REVISION
      - name: Verify the actual Reader package
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 | tee /tmp/router-reader/install.log
          pnpm typecheck 2>&1 | tee /tmp/router-reader/typecheck.log
          pnpm build 2>&1 | tee /tmp/router-reader/build.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: router-reader-owner-check
          path: /tmp/router-reader/
          retention-days: 3
