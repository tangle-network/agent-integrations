name: Verify PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: verify-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run release
      - name: Record tested source
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/commit.txt
          git archive --format=tar.gz -o verification/source.tar.gz HEAD
          sha256sum verification/source.tar.gz > verification/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: verified-source-${{ github.event.pull_request.number }}
          path: verification/
          retention-days: 7
