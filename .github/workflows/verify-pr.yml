name: Verify PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: verify-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Register new public adapters
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'src/connectors/adapters/index.ts';
          let text = readFileSync(path, 'utf8');
          for (const name of ['inkbox', 'linq']) {
            const line = `export { ${name}Connector } from './${name}.js'`;
            if (!text.includes(line)) text += '\n' + line + '\n';
          }
          writeFileSync(path, text);
          JS
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate:bundled-manifests
      - name: Commit exact generated registry
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {owner, repo} = context.repo;
            const pr = context.payload.pull_request;
            const head = (await github.rest.git.getRef({owner, repo, ref: `heads/${pr.head.ref}`})).data.object.sha;
            if (head !== pr.head.sha) throw new Error('PR changed during generation');
            const parent = (await github.rest.git.getCommit({owner, repo, commit_sha: head})).data;
            const tree = [];
            for (const path of ['src/connectors/adapters/index.ts', 'data/bundled-adapter-manifests.json']) {
              const blob = (await github.rest.git.createBlob({owner, repo, content: fs.readFileSync(path, 'utf8'), encoding: 'utf-8'})).data;
              const old = (await github.rest.repos.getContent({owner, repo, path, ref: head})).data;
              if (blob.sha !== old.sha) tree.push({path, mode: '100644', type: 'blob', sha: blob.sha});
            }
            let tested = head;
            if (tree.length) {
              const nextTree = (await github.rest.git.createTree({owner, repo, base_tree: parent.tree.sha, tree})).data;
              const commit = (await github.rest.git.createCommit({owner, repo, tree: nextTree.sha, parents: [head], message: 'chore: generate messaging adapter registry'})).data;
              await github.rest.git.updateRef({owner, repo, ref: `heads/${pr.head.ref}`, sha: commit.sha, force: false});
              tested = commit.sha;
            }
            fs.mkdirSync('verification', {recursive: true});
            fs.writeFileSync('verification/commit.txt', tested + '\n');
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run release
      - name: Pack the verified consumer
        run: |
          mkdir -p verification
          pnpm pack --pack-destination verification --ignore-scripts
          tar --exclude=node_modules --exclude=.git --exclude=verification --exclude=dist -czf verification/source.tar.gz .
          sha256sum verification/*.tgz verification/source.tar.gz > verification/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: messaging-verification-${{ github.event.pull_request.number }}
          path: verification/
          retention-days: 7
