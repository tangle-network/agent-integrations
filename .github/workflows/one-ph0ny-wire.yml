name: Wire canonical ph0ny host configuration
on:
  push:
    branches: [pro/use-ph0ny-sdk]
permissions:
  contents: write
concurrency:
  group: one-ph0ny-delivery
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'tangle-network/agent-integrations'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Extend the existing factory inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/connectors/adapters/factories.ts'); s=p.read_text()
          if 'createPhonyConnector' not in s:
              s="import { createPhonyConnector, type PhonyConnectorOptions } from './phony.js'\n"+s
              anchor='export const CONNECTOR_ADAPTER_FACTORIES: readonly ConnectorAdapterFactoryDefinition[] =\n  [\n'
              assert anchor in s
              s=s.replace(anchor,anchor+"    // Optional deployment override. The credential-only singleton remains the default.\n    defineFactoryAdapter<PhonyConnectorOptions>(createPhonyConnector, { baseUrl: 'PH0NY_API_URL' }),\n")
              p.write_text(s)
          for p in ['.github/workflows/one-ph0ny-delivery.yml','.github/workflows/one-ph0ny-wire.yml']:
              Path(p).unlink(missing_ok=True)
          PY
          node --check scripts/prove-one-ph0ny.mjs
      - name: Commit source and remove temporary delivery workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,subprocess,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; parent=os.environ['GITHUB_SHA']; branch='pro/use-ph0ny-sdk'
          assert repo=='tangle-network/agent-integrations' and os.environ['GITHUB_REF_NAME']==branch
          def api(method,path,body=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,data=None if body is None else json.dumps(body).encode(),method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req) as r: return json.load(r)
          assert api('GET','git/ref/heads/'+branch)['object']['sha']==parent, 'Branch moved'
          entries=[]
          for p in subprocess.check_output(['git','diff','--name-only']).decode().splitlines():
              assert p in ['src/connectors/adapters/factories.ts','.github/workflows/one-ph0ny-delivery.yml','.github/workflows/one-ph0ny-wire.yml']
              sha=None
              if Path(p).exists(): sha=api('POST','git/blobs',{'content':base64.b64encode(Path(p).read_bytes()).decode(),'encoding':'base64'})['sha']
              entries.append({'path':p,'mode':'100644','type':'blob','sha':sha})
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip()
          tree=api('POST','git/trees',{'base_tree':base,'tree':entries})
          commit=api('POST','git/commits',{'message':'feat(ph0ny): configure staging through the existing host factory inventory','tree':tree['sha'],'parents':[parent]})
          api('PATCH','git/refs/heads/'+branch,{'sha':commit['sha'],'force':False})
          print('SOURCE_COMMIT',commit['sha'])
          PY
